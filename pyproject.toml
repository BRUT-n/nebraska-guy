[project]
name = "nebraska-guy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "neo4j>=6.1.0,<6.2",
    "neomodel>=7.0.0",
    "piccolo[postgres]>=1.36.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "testcontainers[neo4j,postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["**/piccolo_migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (стиль)
    "F",   # pyflakes (ошибки)
    "I",   # isort (порядок импортов)
    "B",   # flake8-bugbear (подозрительные места)
    "UP",  # pyupgrade (устаревший синтаксис)
    "S",   # bandit (безопасность)
    "C4",  # flake8-comprehensions (улучшения comprehension)
    "SIM", # flake8-simplify (упрощения кода)
    "RUF", # правила самого Ruff
    "BLE001", # общие исключения, вместо конкретных
]
ignore = [
    "E501",  # длину строк проверяет форматтер, линтеру не надо
    "S101",  # assert — мы используем его в тестах
    "RUF001", # омоглифы в коде
    "RUF002", # омоглифы в докстринг
    "RUF003", # омоглифы в комментариях
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # в тестах assert — это норма

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# исходный код проекта
pythonpath = ["."]
# тесты
testpaths = ["tests"]
# обрабатывать асинхронные тесты
asyncio_mode = "auto"
# время жизни цикла событий по умолчанию
asyncio_default_fixture_loop_scope = "session"
